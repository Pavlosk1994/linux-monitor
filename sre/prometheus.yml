global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    monitor: "linux-node-monitor"
    environment: "production"

# Carrega as regras de alerta e definições de SLOs
rule_files:
  - "alert.rules.yml"

# Encaminha alertas para o Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"
            - "localhost:9093"

# Coleta periódica (Scrape) do endpoint nativo /metrics do Node Monitor
scrape_configs:
  - job_name: "node-monitor"
    metrics_path: "/metrics"
    scrape_interval: 3s
    static_configs:
      - targets:
          - "localhost:8080"
          - "host.docker.internal:8080"
        labels:
          tier: "infrastructure"
          cluster: "edge-nodes"
