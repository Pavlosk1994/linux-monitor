global:
  resolve_timeout: 2m

# Roteador de alertas do ecossistema SRE
route:
  group_by: ["alertname", "hostname", "slo"]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 2h
  receiver: "ai-sre-agent-webhook"

# Receptores de alertas: aponta para o Agente de IA do Node Monitor
receivers:
  - name: "ai-sre-agent-webhook"
    webhook_configs:
      - url: "http://host.docker.internal:8080/api/ai/webhook"
        send_resolved: true
        http_config:
          follow_redirects: true
      - url: "http://localhost:8080/api/ai/webhook"
        send_resolved: true
        http_config:
          follow_redirects: true
